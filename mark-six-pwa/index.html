<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b71c1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mark Six" />
  <meta name="description" content="Hong Kong Mark Six Lottery Results" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Mark Six Results</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <svg class="ball-logo" viewBox="0 0 36 36" width="36" height="36">
        <circle cx="18" cy="18" r="16" fill="#fff" />
        <circle cx="18" cy="18" r="15" fill="#d32f2f" />
        <text x="18" y="24" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">6</text>
      </svg>
      <h1>Mark Six</h1>
      <button id="refreshBtn" class="refresh-btn" title="Refresh">
        <svg class="refresh-icon" viewBox="0 0 24 24" width="24" height="24">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="statusBar" class="status-bar">
      <span id="lastUpdate">Loading...</span>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Fetching latest results...</p>
    </div>

    <div id="error" class="error" style="display:none;">
      <p id="errorMsg"></p>
      <button id="retryBtn" class="retry-btn">Retry</button>
    </div>

    <div id="results" class="results" style="display:none;"></div>

    <div id="loadOlderWrap" class="load-older-wrap" style="display:none;">
      <button id="loadOlderBtn" class="load-older-btn">Load Older Results</button>
      <div id="olderSpinner" class="older-spinner" style="display:none;"></div>
      <span id="olderStatus" class="older-status"></span>
    </div>
  </main>


  <script src="app.js"></script>
</body>
</html>
